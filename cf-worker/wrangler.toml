name = "yqi-jarvis"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Daily proactive scan (Cron Triggers are free on Cloudflare Workers' free plan).
[triggers]
crons = ["0 21 * * *"] # 21:00 UTC = 02:00 Asia/Karachi

[vars]
FIREBASE_PROJECT_ID = "yqi-yunus"
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Secrets (set with `wrangler secret put <NAME>`, never written to this file):
#   GEMINI_API_KEY             - from https://aistudio.google.com/apikey (free)
#   GOOGLE_SERVICE_ACCOUNT_JSON - the full JSON key of a service account with the
#                                 "Cloud Datastore User" role on the yqi-yunus project
#                                 (used only to read/write Firestore via REST, no billing
#                                 account needed for this role)
